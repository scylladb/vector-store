[alias]
openapi = "run --features dev-tools --bin generate-openapi -- api/openapi.json"

# usearch takes its distance kernels from numkong, except the cosine kernels of f32 and f16 indexes,
# which come from crates/cosine-kernels. numkong's aarch64 kernels need gcc >= 13 or clang; the
# release toolchain image compiles them with clang (scripts/Dockerfile.toolchain). Its SME kernels
# stay off: no machine we ship to has SME, and clang's SME code needs compiler-rt
# (`__arm_get_current_vg`), which the libgcc link does not provide. An NK_TARGET_* variable set in
# the environment replaces the value here.
[env]
NK_TARGET_SME = "0"
NK_TARGET_SME2 = "0"
NK_TARGET_SME2P1 = "0"
NK_TARGET_SMEF64 = "0"
NK_TARGET_SMEHALF = "0"
NK_TARGET_SMEBF16 = "0"
NK_TARGET_SMEBI32 = "0"
