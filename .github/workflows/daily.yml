name: Daily

on:
  schedule:
    - cron: '0 0 * * *' # every day at midnight
  workflow_dispatch:
    inputs:
      scylla-image:
        description: 'ScyllaDB docker image to test against, e.g. scylladb/scylla:2026.4.0-rc1, or nightly for the latest scylla-nightly'
        required: false
        type: string
        default: nightly

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: full

jobs:
  # A scheduled run has no inputs, so the input is defaulted again here.
  daily-get-scylla-nightly-digest:
    if: ${{ (inputs.scylla-image || 'nightly') == 'nightly' }}
    uses: $/.github/workflows/get-scylla-nightly-digest.yml
    with:
      use-latest-scylla-nightly: true

  daily-build-validator:
    uses: $/.github/workflows/build-validator.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      ref: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

  daily-build-vector-store:
    uses: $/.github/workflows/build-vector-store.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      ref: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

  daily-get-validator-test-list:
    needs: ["daily-build-validator"]
    uses: $/.github/workflows/get-validator-test-list.yml
    with:
      os: ubuntu-latest
      arch: amd64

  daily-run-validator-tests:
    needs: ["daily-get-scylla-nightly-digest", "daily-build-vector-store", "daily-get-validator-test-list"]
    # The digest job is skipped for a run against a chosen image; the matrix still runs.
    if: ${{ !cancelled() && needs.daily-build-vector-store.result == 'success' && needs.daily-get-validator-test-list.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.daily-get-scylla-nightly-digest.result) }}
    uses: $/.github/workflows/run-validator-tests.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      testcase: ${{ matrix.testcase }}
      ref: ${{ github.sha }}
      scylla-image: ${{ inputs.scylla-image || 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        testcase: ${{fromJSON(needs.daily-get-validator-test-list.outputs.testcases)}}
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

  daily-save-scylla-nightly-digest:
    # Only a run against scylla-nightly may mark a digest as valid.
    if: ${{ (inputs.scylla-image || 'nightly') == 'nightly' }}
    needs: daily-run-validator-tests
    runs-on: ubuntu-latest
    steps:
    - name: Download scylla-nightly digest artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: scylla-nightly-digest

    - name: Show scylla-nightly digest
      run: cat scylla-nightly-digest

    - name: Upload scylla-nightly digest artifact as artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: valid-scylla-nightly-digest
        path: scylla-nightly-digest
