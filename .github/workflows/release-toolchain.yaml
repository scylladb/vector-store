name: release-toolchain

on:
  workflow_dispatch:

jobs:
  build-push-docker-toolchain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      TARGETARCH: ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: version
        name: Determine the version to build and push
        run: |
          set -euo pipefail
          rust_version=$(grep channel ./rust-toolchain.toml | cut -d '"' -f 2)
          toolchain_version=$(grep '^toolchain_version=' ./scripts/build-docker-toolchain | cut -d '=' -f 2)
          docker_tag=ghcr.io/scylladb/vector-store-toolchain:$toolchain_version-$rust_version-$TARGETARCH
          echo "docker_tag=${docker_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if the toolchain image already exists
        run: |
          if out=$(docker buildx imagetools inspect ${{ steps.version.outputs.docker_tag }} 2>&1); then
            echo "Image for this toolchain and rust version already in registry. Bump toolchain_version if new toolchain must be uploaded."
            exit 1
          fi

          case "$out" in
            *403*|*"not found"*)
            exit 0
            ;;

            *)
            echo "Error checking if image exists: $out"
            exit 1
            ;;
          esac

      - name: Build the toolchain image
        run: |
          set -euo pipefail
          ./scripts/build-docker-toolchain

      - name: Push the toolchain image
        run: |
          set -euo pipefail
          docker push ${{ steps.version.outputs.docker_tag }}

