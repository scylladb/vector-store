name: Vector Store Release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      VECTOR_VERSION:
        description: 'Git tag / version to build from (e.g. 1.8.0)'
        required: true

env:
  VECTOR_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.VECTOR_VERSION }}

jobs:
  # Build vector-store once per architecture, natively (no QEMU emulation),
  # and expose the results (binary tarball, docker image, SBOMs) as workflow
  # artifacts for the downstream jobs.
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.VECTOR_VERSION }}
          fetch-depth: 0

      - name: Install SBOM tooling (syft + cargo-cyclonedx) used by build-release
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          cargo install cargo-cyclonedx --locked

      - name: Build image, tarball and SBOMs for ${{ matrix.arch }}
        run: ./scripts/build-release ${{ matrix.arch }}

      - name: Save the docker image
        run: docker save "scylladb/vector-store:${VECTOR_VERSION}-${{ matrix.arch }}" -o "vector-store-image-${VECTOR_VERSION}-${{ matrix.arch }}.tar"

      - name: Upload the docker image as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-store-image-${{ env.VECTOR_VERSION }}-${{ matrix.arch }}
          path: vector-store-image-${{ env.VECTOR_VERSION }}-${{ matrix.arch }}.tar

      - name: Upload the release tarball as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-store-${{ env.VECTOR_VERSION }}-${{ matrix.arch }}
          path: target/${{ matrix.arch }}/release/vector-store-${{ env.VECTOR_VERSION }}-${{ matrix.arch }}.tar.gz

      - name: Upload SBOMs as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-store-sboms-${{ env.VECTOR_VERSION }}-${{ matrix.arch }}
          path: |
            vector-store-${{ env.VECTOR_VERSION }}.cdx.json
            vector-store-docker-${{ env.VECTOR_VERSION }}-${{ matrix.arch }}.cdx.json
          if-no-files-found: warn

  # Push the per-arch images built by the build job (no rebuild) and combine
  # them into a multi-arch manifest.
  push-docker:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the docker image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vector-store-image-${{ env.VECTOR_VERSION }}-*
          merge-multiple: true

      - name: Load the docker images
        run: |
          set -euo pipefail
          for arch in amd64 arm64 ; do
            docker load -i "vector-store-image-${VECTOR_VERSION}-${arch}.tar"
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push per-arch images and multi-arch index
        run: |
          set -euo pipefail
          IMAGE=scylladb/vector-store
          sources=()
          for arch in amd64 arm64 ; do
            docker push "${IMAGE}:${VECTOR_VERSION}-${arch}"
            # reference the linux/$arch manifest by digest, not the per-arch
            # tag: with a provenance attestation attached the tag is an index
            # bundling the image with an unknown/unknown manifest, which would
            # otherwise be copied into the multi-arch tag as well
            digest=$(docker buildx imagetools inspect --raw "${IMAGE}:${VECTOR_VERSION}-${arch}" \
              | jq -r --arg arch "${arch}" \
                '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            if [[ -n "${digest}" ]] ; then
              sources+=("${IMAGE}@${digest}")
            else
              sources+=("${IMAGE}:${VECTOR_VERSION}-${arch}")
            fi
          done
          # imagetools, not `docker manifest`: the latter refuses a source that
          # is itself an index
          docker buildx imagetools create --tag "${IMAGE}:${VECTOR_VERSION}" "${sources[@]}"

      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vector-store-sboms-${{ env.VECTOR_VERSION }}-*
          merge-multiple: true
          path: sboms

      - name: Archive SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-store-sboms-${{ env.VECTOR_VERSION }}
          path: |
            sboms/vector-store-${{ env.VECTOR_VERSION }}.cdx.json
            sboms/vector-store-docker-${{ env.VECTOR_VERSION }}-*.cdx.json
          if-no-files-found: warn

  build-cloud-images:
    needs: [push-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # to attach the packer manifest to the release
      id-token: write     # for GCP Workload Identity Federation
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.VECTOR_VERSION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@d38faf1295e2cddabf3ce395dc78405b7877be2d # v3.0.0
        with:
          version: '1.10.0'

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.VECTOR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.VECTOR_AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-east-1'

      - name: Setup GCP credentials
        uses: google-github-actions/auth@55bd3a7c6e2ae7cf1877fd1ccb9d54c0503c457c # v2.1.2
        with:
          workload_identity_provider: ${{ secrets.VECTOR_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.VECTOR_GCP_SERVICE_ACCOUNT }}

      - name: Build Images
        working-directory: packer
        run: |
          set -euo pipefail
          packer plugins install github.com/hashicorp/googlecompute
          packer plugins install github.com/hashicorp/amazon
          # AWS x86
          packer build -only=amazon-ebs -var vector_version="$VECTOR_VERSION" vector-store-template.json
          # AWS arm64
          packer build -only=amazon-ebs -var vector_version="$VECTOR_VERSION" -var 'arch=arm64' vector-store-template.json
          # GCE x86
          packer build -only=googlecompute -var vector_version="$VECTOR_VERSION" vector-store-template.json

      - name: Archive Packer manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-store-cloud-images-${{ env.VECTOR_VERSION }}
          path: packer/packer-manifest.json

      - name: Upload Packer manifest to the release
        if: github.event_name == 'release' && github.event.release
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: packer/packer-manifest.json
          asset_name: vector-store-cloud-images-${{ env.VECTOR_VERSION }}.json
          asset_content_type: application/json

  # Hand the freshly built cloud images over to siren: extract the image IDs
  # from the packer manifest and send the repository_dispatch that starts
  # https://github.com/scylladb/siren/actions/workflows/add-vectorstore-ver.yml,
  # which opens a versions.yaml PR in scylladb/siren. A separate job consuming
  # the manifest artifact (the push-docker pattern) keeps the dispatch
  # re-runnable without rebuilding the images.
  trigger-siren:
    needs: [build-cloud-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the version is a GA release
        id: ga
        run: |
          set -euo pipefail
          # siren validates the version against ^X.Y.Z$ and unconditionally
          # moves its defaults.vectorstore to it, so pre-release and dev tags
          # (1.6.1-rc0, X.Y.Z-dev) must not be dispatched. The release trigger
          # already filters prereleases out, but workflow_dispatch takes an
          # arbitrary VECTOR_VERSION — skip (not fail) the job on those.
          if [[ "${VECTOR_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ; then
            echo "ga=true" >> "$GITHUB_OUTPUT"
          else
            echo "ga=false" >> "$GITHUB_OUTPUT"
            echo "Version \`${VECTOR_VERSION}\` is not a GA X.Y.Z release — skipping the siren dispatch" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download the packer manifest artifact
        if: steps.ga.outputs.ga == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vector-store-cloud-images-${{ env.VECTOR_VERSION }}

      - name: Extract the image IDs from the packer manifest
        if: steps.ga.outputs.ga == 'true'
        id: images
        run: |
          set -euo pipefail
          # All three sequential packer builds append to the one .builds[]
          # array, and a re-run appends rather than replaces — take the last
          # matching entry. The AWS builds are told apart by the arch recorded
          # in custom_data by the manifest post-processor; their artifact_id
          # is a comma-separated region:ami list and siren expects the bare
          # us-east-1 AMI (it prefixes the value with us-east-1/ itself).
          # The GCP image needs no such disambiguation: only one architecture
          # (amd64) is built there, so builder_type alone identifies it.
          aws_ami() {
            jq -r --arg arch "$1" \
              '[.builds[] | select(.builder_type=="amazon-ebs" and .custom_data.arch==$arch)] | last | .artifact_id // empty' \
              packer-manifest.json \
              | tr ',' '\n' | { grep '^us-east-1:' || true ; } | cut -d: -f2
          }
          aws_amd64_ami=$(aws_ami amd64)
          aws_arm64_ami=$(aws_ami arm64)
          gcp_amd64_image=$(jq -r \
            '[.builds[] | select(.builder_type=="googlecompute")] | last | .artifact_id // empty' \
            packer-manifest.json)
          for var in aws_amd64_ami aws_arm64_ami gcp_amd64_image ; do
            if [[ -z "${!var}" ]] ; then
              echo "::error::failed to extract ${var} from packer-manifest.json"
              exit 1
            fi
            echo "${var}=${!var}" >> "$GITHUB_OUTPUT"
          done

      - name: Trigger the siren add-vectorstore-ver workflow
        if: steps.ga.outputs.ga == 'true'
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.SIREN_REPO_TOKEN }}
          repository: scylladb/siren
          event-type: vectorstore-release
          client-payload: |
            {
              "version": "${{ env.VECTOR_VERSION }}",
              "aws_amd64_ami": "${{ steps.images.outputs.aws_amd64_ami }}",
              "gcp_amd64_image": "${{ steps.images.outputs.gcp_amd64_image }}",
              "aws_arm64_ami": "${{ steps.images.outputs.aws_arm64_ami }}"
            }

      - name: Log the siren workflow link
        if: steps.ga.outputs.ga == 'true'
        env:
          AWS_AMD64_AMI: ${{ steps.images.outputs.aws_amd64_ami }}
          AWS_ARM64_AMI: ${{ steps.images.outputs.aws_arm64_ami }}
          GCP_AMD64_IMAGE: ${{ steps.images.outputs.gcp_amd64_image }}
        run: |
          set -euo pipefail
          # repository_dispatch returns 204 with no run id, so the run status
          # cannot be reported here — link to the siren workflow page instead.
          {
            echo "Dispatched \`vectorstore-release\` for \`${VECTOR_VERSION}\` to scylladb/siren:"
            echo ""
            echo "- \`aws_amd64_ami\`: \`${AWS_AMD64_AMI}\`"
            echo "- \`aws_arm64_ami\`: \`${AWS_ARM64_AMI}\`"
            echo "- \`gcp_amd64_image\`: \`${GCP_AMD64_IMAGE}\`"
            echo ""
            echo "Check <https://github.com/scylladb/siren/actions/workflows/add-vectorstore-ver.yml> for the resulting run and versions.yaml PR."
          } >> "$GITHUB_STEP_SUMMARY"

  announce:
    needs: [push-docker, build-cloud-images]
    runs-on: ubuntu-latest
    steps:
      - name: Announce release on Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            --data "{
              \"channel\": \"#release-announce\",
              \"text\": \"<!here> ScyllaDB Vector Store *${VECTOR_VERSION}* is released\",
              \"link_names\": 1
            }" \
            https://slack.com/api/chat.postMessage
