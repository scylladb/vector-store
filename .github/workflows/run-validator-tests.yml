name: run-validator-tests

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system for the build'
        required: true
        type: string
      arch:
        description: 'Architecture for the build'
        required: true
        type: string
      testcase:
        description: 'Test case to run'
        required: true
        type: string
      scylla-image:
        description: 'ScyllaDB docker image to test against, or nightly for scylla-nightly at the digest artifact'
        required: false
        type: string
        default: nightly

permissions:
  contents: read

jobs:
  run-validator-tests:
    runs-on: ${{ inputs.os }}

    steps:
    - name: Download scylla-nightly digest artifact
      if: ${{ inputs.scylla-image == 'nightly' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: scylla-nightly-digest

    - name: Download vector-store artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vector-store-${{inputs.arch}}

    - name: Download vector-search-validator artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vector-search-validator-${{inputs.arch}}

    - name: Chmod a+x downloaded artifacts
      run: chmod a+x vector-store vector-search-validator

    - name: Disable apparmor user namespace restrictions
      run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

    - name: Run the Validator tests for testcase ${{inputs.testcase}}
      env:
        testcase: ${{inputs.testcase}}
        scylla_image: ${{inputs.scylla-image}}
      run: |
        [[ "${scylla_image,,}" != nightly ]] || scylla_image=scylladb/scylla-nightly@$(cat scylla-nightly-digest)
        [[ "$scylla_image" =~ ^[A-Za-z0-9][A-Za-z0-9._/:@-]*$ ]] || { echo "invalid scylla image reference: '$scylla_image'"; exit 1; }
        echo "scylla image: $scylla_image"
        ./vector-search-validator run "$scylla_image" ./vector-store "${testcase}::*" --verbose
