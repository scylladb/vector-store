name: Rust

on:
  push:
    branches:
    - 'master'

  pull_request:
    branches:
    - 'master'

  merge_group:

permissions:
  contents: read

# A push to a pull request cancels the run still testing its previous commit.
# Any other run gets a group of its own, so merge group and master runs are
# never cancelled. So does a re-run: it would test the commit of the run it
# repeats, which may no longer be the head of the pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && github.run_attempt == '1' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: full

jobs:
  rust-check-code-changes:
    uses: $/.github/workflows/check-code-changes.yml

  cargo-clippy:
    needs: ["rust-check-code-changes"]
    if: needs.rust-check-code-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      with:
        components: clippy

    - name: Print rustc version
      run: rustc --version

    - name: Print cargo-clippy version
      run: cargo clippy --version

    - name: Run cargo-clippy checks
      run: cargo clippy --all-targets --workspace -- -Dwarnings

    - name: Run cargo-clippy checks for test-hooks feature flag
      run: cargo clippy --features slow-test-hooks --all-targets --workspace -- -Dwarnings

  cargo-fmt:
    needs: ["rust-check-code-changes"]
    if: needs.rust-check-code-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      with:
        components: rustfmt

    - name: Print rustc version
      run: rustc --version

    - name: Print cargo-fmt version
      run: cargo fmt --version

    - name: Run cargo-fmt checks
      run: cargo fmt --all --check

  cargo-test:
    needs: ["rust-check-code-changes"]
    if: needs.rust-check-code-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

    - name: Print rustc version
      run: rustc --version

    - name: Run cargo-test checks
      # Fails crates/cosine-kernels' tests if its AVX2 kernel did not run.
      env:
        COSINE_KERNELS_EXPECTED: haswell
      run: cargo test --features dev-tools,slow-test-hooks --verbose --all-targets --workspace

  # The test job above runs on x86, so crates/cosine-kernels' tests of its
  # aarch64 kernels, the ones Vector Store runs on Graviton, would skip them.
  # (The validator builds and runs Vector Store on arm64, but does not compare
  # the kernels with a reference.) This runner (Azure Cobalt 100, Neoverse N2:
  # SVE2 and FEAT_FHM) runs all four; COSINE_KERNELS_EXPECTED fails the tests
  # if one of them did not run, instead of letting them skip it.
  cargo-test-arm64:
    needs: ["rust-check-code-changes"]
    if: needs.rust-check-code-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

    - name: Print rustc version and CPU features
      run: |
        rustc --version
        grep -m1 Features /proc/cpuinfo

    - name: Run cosine-kernels tests
      env:
        COSINE_KERNELS_EXPECTED: neon,sve,neonfhm,sve2
      run: cargo test -p cosine-kernels --verbose -- --nocapture

  cargo-deny:
    needs: ["rust-check-code-changes"]
    if: needs.rust-check-code-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

    - name: Setup cargo-deny
      uses: taiki-e/install-action@894ed6ded408bba4b650a982305dc5353e661648 # cargo-deny

    - name: Print cargo-deny version
      run: cargo deny --version

    - name: Run cargo-deny checks
      run: cargo deny check

  cargo-machete:
    needs: ["rust-check-code-changes"]
    if: needs.rust-check-code-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

    - name: Setup cargo-machete
      uses: taiki-e/install-action@d56616f1be134d33d513c59d577b2c0142b64a83 # cargo-machete

    - name: Print cargo-machete version
      run: cargo machete --version

    - name: Run cargo-machete checks
      run: cargo machete

  cargo-sbom:
    needs: ["rust-check-code-changes"]
    if: needs.rust-check-code-changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

    - name: Setup cargo-cyclonedx
      uses: taiki-e/install-action@4fb4bfc098655bcd1461f113b03ff34ffb480d16 # cargo-cyclonedx

    - name: Print cargo-cyclonedx version
      run: cargo cyclonedx --version

    - name: Generate SBOM
      run: cargo cyclonedx --manifest-path crates/vector-store/Cargo.toml --format json

    - name: Validate SBOM
      run: |
        file=crates/vector-store/vector-store.cdx.json
        [[ -s $file ]] || { echo "SBOM file is empty"; exit 1; }
        python3 -c "import json; json.load(open('$file'))"

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom
        path: crates/vector-store/vector-store.cdx.json
        retention-days: 7

  rust-workflow-status:
    needs: ["rust-check-code-changes", "cargo-clippy", "cargo-fmt", "cargo-test", "cargo-test-arm64", "cargo-deny", "cargo-machete", "cargo-sbom"]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check workflow status
      run: |
        return_code=0

        # The jobs below are skipped unless this one succeeds, so anything but
        # success means nothing was checked.
        if [[ "${{ needs.rust-check-code-changes.result }}" != "success" ]]; then
          echo "rust-check-code-changes job did not succeed"
          return_code=1
        fi

        if [[ "${{ needs.cargo-clippy.result }}" == "failure" ]]; then
          echo "cargo-clippy job failed"
          return_code=1
        fi

        if [[ "${{ needs.cargo-fmt.result }}" == "failure" ]]; then
          echo "cargo-fmt job failed"
          return_code=1
        fi

        if [[ "${{ needs.cargo-test.result }}" == "failure" ]]; then
          echo "cargo-test job failed"
          return_code=1
        fi

        if [[ "${{ needs.cargo-test-arm64.result }}" == "failure" ]]; then
          echo "cargo-test-arm64 job failed"
          return_code=1
        fi

        if [[ "${{ needs.cargo-deny.result }}" == "failure" ]]; then
          echo "cargo-deny job failed"
          return_code=1
        fi

        if [[ "${{ needs.cargo-machete.result }}" == "failure" ]]; then
          echo "cargo-machete job failed"
          return_code=1
        fi

        if [[ "${{ needs.cargo-sbom.result }}" == "failure" ]]; then
          echo "cargo-sbom job failed"
          return_code=1
        fi

        if [[ $return_code -ne 0 ]]; then
          exit $return_code
        fi

        echo "All jobs succeeded"

    # A job ends as cancelled when its run is cancelled, e.g. by a newer push
    # to the same pull request, or when it times out. It did not finish
    # testing the change, so the run must not report success. always() runs
    # this step in a cancelled run too.
    - name: Check that no job was cancelled
      if: always() && contains(needs.*.result, 'cancelled')
      run: |
        echo "A job was cancelled or timed out, so the change was not fully tested"
        exit 1

